name: LumiScore quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Migration byte regressions compare against an approved historical blob.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - run: npm install --global pnpm@11.25.0
      - id: install
        run: pnpm install --frozen-lockfile
      - id: unit
        run: pnpm test:unit
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec tsc --noEmit
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build:vercel
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm scan:client-secrets
      - if: ${{ !cancelled() }}
        run: git diff --check
      # Deliberately no credentials, DB writes, PR comments, migrations or deployment.
