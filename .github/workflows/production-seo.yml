name: LumiScore production SEO monitoring
on:
  # Automatic monitoring disabled at the owner's request on 2026-11-19.
  # The GitHub workflow is also disabled; this retained entry is manual only.
  workflow_dispatch:
    inputs:
      full:
        description: 'Check every monitored book page (higher production usage)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/operations/monitor-seo.mjs ${{ inputs.full && '--full' || '--daily' }}
