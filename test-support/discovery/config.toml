# Isolated local fixture only. Never link this directory to a hosted project.
project_id = "lumiscore-pr8-discovery"
[api]
enabled = true
port = 55431
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 55432
shadow_port = 55430
major_version = 17
[db.migrations]
enabled = false
[db.seed]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 55434
[auth]
enabled = true
site_url = "http://127.0.0.1:3015"
additional_redirect_urls = ["http://127.0.0.1:3015/auth/callback", "http://127.0.0.1:3015/auth/callback?flow=recovery&next=/update-password&recovery_state=*", "http://127.0.0.1:3015/update-password"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
enable_refresh_token_rotation = true
[auth.email]
# CLI maps this setting to the email provider. Global auth.enable_signup above
# still blocks public registration; keep the provider enabled for password login.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
[storage]
enabled = false
[realtime]
enabled = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
